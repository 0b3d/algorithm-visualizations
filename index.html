<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algorithm Visualizations</title>
  <meta name="description" content="Interactive, step-by-step visualizations of classic algorithms.">
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --ink: light-dark(#24303c, #dde4eb);
      --ink-strong: light-dark(#16324f, #f1f5f9);
      --muted: light-dark(#6b7885, #9aa7b4);
      --line: light-dark(#d5dde4, #34424f);
      --surface: light-dark(#ffffff, #12181f);
      --accent: light-dark(#1a63a9, #5ea6ea);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 3rem);
    }

    h1 { margin: 0 0 0.25rem; color: var(--ink-strong); font-size: clamp(1.5rem, 1.2rem + 1.5vw, 2.25rem); }
    h2 { margin: 2rem 0 0.75rem; color: var(--ink-strong); font-size: 1.15rem; }
    p { margin: 0; color: var(--muted); }

    ul {
      display: grid;
      gap: 0.75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      display: block;
      padding: 1rem 1.25rem;
      border: 2px solid var(--line);
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--accent);
      outline: none;
    }

    a strong { display: block; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Algorithm Visualizations</h1>
    <p>Interactive, step-by-step visualizations of classic algorithms.</p>

    <h2>Sorting</h2>
    <ul>
      <li>
        <a href="sorting-elementary/">
          <strong>Elementary sorting algorithms</strong>
          Bubble sort, selection sort and insertion sort, with the C++ code highlighted at every step.
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
